name: Continuous Ametathetos Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Install Nightly GCC Snapshot
      run: |
        wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb
        sudo dpkg -i gcc-latest.deb
        
        # Force the environment to use the absolute latest experimental build paths
        echo "/opt/gcc-latest/bin" >> $GITHUB_PATH
        echo "CC=/opt/gcc-latest/bin/gcc" >> $GITHUB_ENV
        echo "CXX=/opt/gcc-latest/bin/g++" >> $GITHUB_ENV
        echo "LD_RUN_PATH=/opt/gcc-latest/lib64" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/opt/gcc-latest/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Verify Compiler
      run: $CXX --version # This will print out your expected experimental 16/17 branch state

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract the standalone ~1.4 MB binary directly into the runner's PATH
    - name: Fetch Pre-compiled cnpm
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest true
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    # 3. Inject the GCC 17 snapshot libraries into the runtime link environment
    - name: Install Development Dependencies via cnpm
      run: |
        cnpm install

    - name: Execute Test Suite
      run: |
         cnpm test
