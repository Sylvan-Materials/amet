name: Continuous Ametathetos Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    # Installs a standard stable compiler to process your C++23 source targets
    - name: Install Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 make

    # THE FIX: Create a shell wrapper that redirects 'cnpm' straight into Docker!
    # Mounting the workspace via -v lets cnpm populate your local cpp_modules folder safely.
    - name: Configure cnpm Container Proxy
      run: |
        echo '#!/bin/bash' > cnpm
        echo 'docker run --rm -v "${{ github.workspace }}:${{ github.workspace }}" -w "${{ github.workspace }}" ghcr.io/datadriven-cam/cnpm:latest "$@"' >> cnpm
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    - name: Install Development Dependencies via cnpm
      run: |
        cnpm install

    - name: Execute Test Suite
      run: |
        cnpm test
