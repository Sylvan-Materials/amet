name: Continuous Ametathetos Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Upgrade System Toolchain to Experimental GCC
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y --only-upgrade libstdc++6   # Pulls the 3.4.36 ABI cleanly
        sudo apt-get install -y g++-16 make                 # Installs your build environment
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100

    - name: Fetch Pre-compiled cnpm
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest true
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    - name: Install Development Dependencies via cnpm
      run: |
        cnpm install

    - name: Execute Test Suite
      run: |
        cnpm test
