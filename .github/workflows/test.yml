name: Continuous Ametathetos Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    # 1. Install a stable compiler for your project alongside the experimental snapshot library
    - name: Provision GCC 14 and Bleeding-Edge Runtime Environment
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y g++-14 gcc-snapshot make
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

    # 2. Extract your native cnpm binary straight onto the host runner filesystem
    - name: Fetch Pre-compiled cnpm Binary
      run: |
        docker create --name cnpm-container ghcr.io/datadriven-cam/cnpm:latest true
        docker cp cnpm-container:/usr/local/bin/cnpm ./cnpm
        docker rm cnpm-container
        chmod +x ./cnpm
        sudo mv ./cnpm /usr/local/bin/cnpm

    # 3. Inject the GCC 17 snapshot libraries into the runtime link environment
    - name: Install Development Dependencies via cnpm
      run: |
        export LD_LIBRARY_PATH=/usr/lib/gcc-snapshot/lib:$LD_LIBRARY_PATH
        cnpm install

    - name: Execute Test Suite
      run: |
        export LD_LIBRARY_PATH=/usr/lib/gcc-snapshot/lib:$LD_LIBRARY_PATH
         cnpm test
